prefix: "<dark_gray>[<light_purple>Bounty<dark_gray>] <reset>"

usage: "<gold>Plugin made by Malusic!\n<red>Usage: <gray>/bounty <check|set|remove|bet>"

usage-check: "<red>Usage: <gray>/bounty check <player>"
usage-set: "<red>Usage: <gray>/bounty set <player> <amount>"
usage-remove: "<red>Usage: <gray>/bounty remove <player>"
usage-bet: "<red>Usage: <gray>/bounty bet <player> <amount>"

unknown-command: "<red>Unknown subcommand."
invalid-amount: "<red>Invalid amount."

check:
  result: "<yellow>{player}'s <green>bounty: <gold>{amount}"

set:
  success: "<green>Set <yellow>{player}'s <green>bounty to <gold>{amount}"

remove:
  success: "<green>Removed <yellow>{player}'s <green>bounty."

bet:
  success: "<green>Added <gold>{amount} <green>to <yellow>{player}'s <green>bounty."
  new-total: "<green>New bounty: <gold>{amount}"
  insufficient-funds: "<red>You don't have enough money. You need <gold>{amount}<red>."
  payment-failed: "<red>Could not withdraw the money. Please try again."
  self: "<red>You can't bet on your own bounty."

usage-top: "<red>Usage: /bounty top [page]"

top:
  header: "<gold><bold>Top Bounties</bold> <gray>(page {page}/{pages})"
  entry: "<yellow>#{rank} <white>{player} <gray>- <green>{amount}"
  footer: "<gray>Use <yellow>/bounty top {next}</yellow> for the next page."
  empty: "<red>There are no active bounties."
  invalid-page: "<red>Invalid page number."

player-only: "<red>This command can only be used by a player."

unknown-player: "<red>That player has never joined this server."

reload:
  success: "<green>Messages have been reloaded successfully."

claim:
  broadcast: "<gold>{killer}</gold> <gray>claimed the bounty of</gray> <green>{amount}</green> <gray>on</gray> <red>{victim}</red>"

no-permission: "<red>You don't have permission to do that."